[package]
name = "tauri-plugin-mobile-vault"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-mobile-vault"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "=2.6.0", features = ["build"] }
