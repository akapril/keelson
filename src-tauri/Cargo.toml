[package]
name = "keelson"
# 注：应用版本以 package.json 为唯一来源（tauri.conf.json version 指向它）。
# 此处为 Rust crate 内部版本，与应用展示/打包版本解耦，无需随应用版本变动。
version = "0.3.1"
description = "Keelson — Tauri v2 + React 19 桌面应用"
authors = ["akapril"]
edition = "2021"

# 更多键及其定义参见 https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# _lib 后缀看似冗余，但在 Windows 上必须如此，
# 以避免 lib 名与 bin 名冲突。
# 参见：https://github.com/rust-lang/cargo/issues/8519
name = "keelson_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
# keyring 需显式启用平台后端，否则默认走 mock（内存态）导致 secret 重启即变。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
anyhow = "1"
rand = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22" # Web 认证：配对码/token 的 base64url 编码（Cargo.lock 已有 0.22.1 传递依赖，此处仅提升为直接依赖）
hex = "0.4"
notify = "7"
tantivy = "0.22"
jieba-rs = "0.7"
toml = "0.8"
bincode = "1" # RAG 向量文件序列化
# ── 进程管理内核（从 claude-runtime 融入）所需 ──
uuid = { version = "1", features = ["v4"] } # 进程短 ID
subtle = "2" # 常量时间比较（Bearer 鉴权防时序侧信道）
regex = "1" # 日志级别解析
encoding_rs = "0.8" # 进程日志解码：GBK/GB18030 回退，修 Windows 中文子进程乱码
fastembed = { version = "4", optional = true } # 本地嵌入（ONNX），仅 local-embed feature
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server"] }
# axum 的 WebSocket 支持在 0.8 里由 "ws" feature 门控（Task 11 /ws/terminal 双向泵需要）。
axum = { version = "0.8", features = ["ws"] }
# Web Gateway 静态前端 serve（dist）。仅启用 fs feature 取 ServeDir；
# tower-http 已作为 axum 传递依赖存在于 Cargo.lock，此处仅提升为直接依赖并加 fs feature。
tower-http = { version = "0.6", features = ["fs"] }
# Web 远程终端（Task 10）：内嵌伪终端（PTY），在本机拉起 CLI agent 并持有其 stdin/stdout，
# 供 Task 11 的 WebSocket 双向泵读写。跨平台（Windows 走 ConPTY）。
portable-pty = "0.8"
sysinfo = "0.38.4"
netstat2 = "0.11.2"
tauri-plugin-single-instance = "2.4.3"
sys-locale = "0.3.2"
tauri-plugin-autostart = "2.5.1"

[features]
local-embed = ["dep:fastembed"]

[dev-dependencies]
tempfile = "3"

# ── dev 构建瘦身：大幅缩减 target/debug 体积（调试信息是 Windows 上的大头）──
# 自己的代码保留「行号级」调试信息（panic/backtrace 仍带行号），去掉变量级，省 PDB。
[profile.dev]
debug = "line-tables-only"

# 依赖占 target 绝大头，且极少需要在依赖里下断点 → 依赖完全去调试信息。
# 只影响本地 dev 体积/编译，不改产物行为；release 不受影响。
[profile.dev.package."*"]
debug = false

