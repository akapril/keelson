name: Release Please

# 版本号自动化：读取 master 上的 Conventional Commits（feat/fix/…），
# 自动开「Release PR」——里面已把 package.json + Cargo.toml 版本号改好、CHANGELOG 写好。
# 合并该 PR 即：打 tag vX.Y.Z + 建【草稿】Release，随后同一 workflow 的 build 作业
# 四平台构建安装包并挂到该草稿 Release。你人工检查产物齐了再点 Publish：
#   - updater 只认已发布的 latest → 发布即生效；
#   - winget.yml 监听 released → 发布后自动提交 winget 清单。
#
# 一次性前置（只做一次，仓库 Settings）：
#   Settings → Actions → General → Workflow permissions：
#     ① 选 "Read and write permissions"
#     ② 勾 "Allow GitHub Actions to create and approve pull requests"（否则开不了 Release PR）

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  # 作业一：维护 Release PR；合并后创建 tag + 草稿 Release
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['.--release_created'] }}
      release_id: ${{ steps.release.outputs['.--id'] }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 作业二：仅当上一步真的切了版本才构建；同一 workflow 内用 needs 串联，
  # 无需 PAT（跨 workflow 触发会被 GITHUB_TOKEN 拦截，同 workflow 不受限）。
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false # 单平台失败不牵连其余平台
      matrix:
        include:
          - platform: macos-latest # Apple Silicon（arm64）
            target: aarch64-apple-darwin
          - platform: macos-13 # Intel（x64）
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04 # Linux x64（webkit2gtk 4.1 需 22.04+）
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest # Windows x64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust（含目标三元组）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 在 Linux 编译/打包所需系统库
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - name: 安装前端依赖
        run: pnpm install

      # tauri-action 会调用 beforeBuildCommand=`pnpm build`，其 prebuild 钩子
      # 自动按当前平台三元组下载 PocketBase sidecar（host==target，无交叉，命名天然匹配）。
      # 传 releaseId：把产物挂到 release-please 已建的那个草稿 Release，而非另建。
      - name: 构建并上传产物
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名私钥（空密码，见 README「发布」章节的 secret 配置）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          args: --target ${{ matrix.target }}
