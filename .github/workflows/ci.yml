name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  frontend:
    name: 前端（lint / tsc / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  backend:
    name: 后端（cargo test / clippy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Tauri v2 在 Linux 编译所需系统库
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # clippy 先 warn-only（不加 -D warnings）；存量清理后再收紧为门禁
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml
